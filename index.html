<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>民用航空运输企业会计 · 智能教学平台</title>
<style>
  :root{
    --bg:#f4f7fb; --card:#ffffff; --ink:#1f2329; --muted:#5a6573;
    --primary:#2f6fed; --primary-d:#1d4fc4; --accent:#0fb5ba;
    --ok:#1f9d55; --warn:#e08a00; --danger:#d64545; --line:#e3e9f2;
    --chip:#eef3ff; --radius:14px; --shadow:0 2px 10px rgba(31,45,61,.06);
  }
  *{box-sizing:border-box}
  .learn-path{margin-top:16px}
  .lp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .lp-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media(max-width:640px){.lp-grid{grid-template-columns:1fr}}
  .lp-item{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;transition:.15s}
  .lp-item:hover{border-color:var(--primary);box-shadow:0 4px 14px rgba(47,111,237,.12);transform:translateY(-1px)}
  .lp-id{flex:0 0 auto;font-size:12px;font-weight:800;color:#fff;background:var(--primary);padding:3px 8px;border-radius:8px;min-width:42px;text-align:center}
  .lp-body{flex:1 1 auto;min-width:0}
  .lp-name{font-size:14px;font-weight:700;color:var(--ink)}
  .lp-meta{font-size:12px;color:var(--muted);margin-top:2px}
  .lp-desc{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
  .lp-acts{display:flex;gap:6px;margin-top:8px}
  .lp-acts button{flex:0 0 auto;font-size:12px;padding:5px 12px;border:none;border-radius:8px;cursor:pointer;font-weight:600}
  .lp-acts .go-kg{background:var(--chip);color:var(--primary-d)}
  .lp-acts .go-quiz{background:var(--primary);color:#fff}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); font-size:15px; line-height:1.55;
    -webkit-text-size-adjust:100%;
  }
  a{color:var(--primary);text-decoration:none}
  .wrap{max-width:1120px;margin:0 auto;padding:0 16px}
  header.top{
    background:linear-gradient(135deg,var(--primary),var(--primary-d));
    color:#fff;padding:18px 0 14px;box-shadow:var(--shadow);
  }
  header.top h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.5px}
  header.top .sub{font-size:13px;opacity:.9;margin-top:3px}
  header.top .ver{display:inline-block;margin-top:6px;font-size:12px;background:rgba(255,255,255,.18);
    padding:2px 10px;border-radius:20px}
  nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;position:sticky;top:0;
    background:var(--bg);z-index:20;border-bottom:1px solid var(--line)}
  nav.tabs button{
    flex:0 0 auto;border:none;background:transparent;color:var(--muted);font-size:14px;
    padding:9px 16px;border-radius:20px;cursor:pointer;font-weight:600;min-height:44px;
  }
  nav.tabs button.active{background:var(--primary);color:#fff}
  main{padding:18px 0 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}}
  @media(max-width:480px){.g2,.g3,.g4{grid-template-columns:1fr}}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;box-shadow:var(--shadow)}
  .stat .n{font-size:26px;font-weight:800;color:var(--primary)}
  .stat .l{font-size:12.5px;color:var(--muted);margin-top:2px}
  .stat .s{font-size:11.5px;margin-top:4px}
  .pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600}
  .pill.ok{background:#e6f6ec;color:var(--ok)}
  .pill.warn{background:#fdf2dd;color:var(--warn)}
  .pill.draft{background:#eef1f6;color:var(--muted)}
  .pill.blue{background:var(--chip);color:var(--primary)}
  h2.sec{font-size:17px;margin:6px 0 12px;display:flex;align-items:center;gap:8px}
  h2.sec svg{width:20px;height:20px;flex:0 0 auto}
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .filters select,.filters input{
    border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;
    background:#fff;color:var(--ink);min-height:42px}
  .filters input{flex:1;min-width:160px}
  button.btn{border:none;background:var(--primary);color:#fff;font-weight:700;
    padding:10px 18px;border-radius:10px;cursor:pointer;font-size:14px;min-height:44px}
  button.btn.ghost{background:#fff;color:var(--primary);border:1px solid var(--primary)}
  button.btn.sm{padding:7px 12px;font-size:13px;min-height:38px}
  button.btn:active{transform:translateY(1px)}
  button.link{background:none;border:none;color:var(--primary);cursor:pointer;font-size:13px;padding:4px 6px}
  .kp{border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:#fff;transition:.15s}
  .kp:hover{border-color:var(--primary)}
  .kp .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .kp .id{font-size:11.5px;font-weight:700;color:var(--primary);background:var(--chip);
    padding:2px 8px;border-radius:6px}
  .kp .tt{font-weight:700;font-size:15px;flex:1}
  .kp .ly{font-size:11px;color:var(--muted)}
  .kp .sm{color:var(--muted);font-size:13.5px;margin-top:6px}
  .kp .detail{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
  .kp.open .detail{display:block}
  .kp .kpis{font-size:12.5px;color:var(--ink)}
  .kp .kpis li{margin:3px 0}
  .diff{display:inline-flex;gap:2px;vertical-align:middle}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
  .dot.on{background:var(--warn)}
  .chart-card{display:flex;flex-direction:column;align-items:center}
  .legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:8px;justify-content:center}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
  .quiz-q{font-size:16px;font-weight:600;margin-bottom:12px}
  .opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;
    border-radius:10px;padding:12px 14px;margin-bottom:9px;cursor:pointer;font-size:14.5px;min-height:46px}
  .opt:hover{border-color:var(--primary)}
  .opt.sel{border-color:var(--primary);background:var(--primary);color:#fff;font-weight:600}
  .opt.sel .tk{color:#fff}
  .opt.right{background:#e6f6ec;border-color:var(--ok)}
  .opt.wrong{background:#fdeaea;border-color:var(--danger)}
  .opt .tk{font-weight:700;margin-right:8px;color:var(--primary)}
  .exp{background:#f6f9fd;border-left:3px solid var(--primary);padding:10px 12px;border-radius:6px;
    font-size:13.5px;color:var(--ink);margin-top:10px}
  #ansBox{margin-top:10px}
  .adv{color:var(--danger);font-weight:600;font-size:13px;margin-right:8px}
  .qmeta{font-size:12px;color:var(--muted);margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap}
  .prog{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0}
  .prog>i{display:block;height:100%;background:var(--primary);width:0}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .muted{color:var(--muted)}
  .small{font-size:12.5px}
  .callout{border:1px solid #f4d9a6;background:#fff8ec;border-radius:12px;padding:14px 16px}
  .callout b{color:var(--warn)}
  table.t{width:100%;border-collapse:collapse;font-size:13px}
  table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left}
  table.t th{color:var(--muted);font-weight:600}
  .score-big{font-size:46px;font-weight:800;color:var(--primary);text-align:center}
  .tag{font-size:11px;padding:1px 7px;border-radius:6px;background:#eef1f6;color:var(--muted);margin-left:6px}
  .tag.pending{background:#fdf2dd;color:var(--warn)}
  .hidden{display:none}
  .dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .footer{text-align:center;color:var(--muted);font-size:12px;padding:18px 0 40px}
  .empty{padding:30px;text-align:center;color:var(--muted)}
  @media(max-width:760px){
    .stat .n{font-size:22px}
    header.top h1{font-size:18px}
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1 id="appTitle">民用航空运输企业会计 · 智能教学平台</h1>
    <div class="sub" id="appSub">知识图谱驱动的智能课程系统</div>
    <div class="ver" id="appVer">Phase 7 · 部署上线</div>
  </div>
</header>

<nav class="tabs wrap" id="nav">
  <button data-tab="overview" class="active">概览</button>
  <button data-tab="kg">知识图谱</button>
  <button data-tab="quiz">练习中心</button>
  <button data-tab="dash">教师驾驶舱</button>
  <button data-tab="review">复核中心</button>
  <button data-tab="agent">智能助教</button>
</nav>

<main class="wrap" id="view"></main>

<footer class="footer">
  数据本地离线运行 · 全部内容以教师复核（reviewed）为准 · AI 生成内容标记为待审（pending）
</footer>

<script src="data.bundle.js"></script>
<script src="rag-client.js"></script>
<script>
(function(){
  "use strict";
  var D = window.APP_DATA;
  var view = document.getElementById("view");
  if(!D){ view.innerHTML = '<div class="card empty">未加载数据（data.bundle.js）。请确认本文件与 data.bundle.js 在同一目录。</div>'; return; }

  // ---------- helpers ----------
  function h(tag, attrs, kids){
    var e=document.createElement(tag);
    if(attrs) for(var k in attrs){ if(k==="html") e.innerHTML=attrs[k]; else if(k==="class") e.className=attrs[k]; else if(k==="onclick") e.onclick=attrs[k]; else e.setAttribute(k,attrs[k]); }
    if(kids){ if(!Array.isArray(kids)) kids=[kids]; kids.forEach(function(c){ if(c==null) return; e.appendChild(typeof c==="string"?document.createTextNode(c):c); }); }
    return e;
  }
  function svg(markup){ var d=document.createElement("div"); d.innerHTML='<svg xmlns="http://www.w3.org/2000/svg" '+markup+'</svg>'; return d.firstChild; }
  function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); }
  function byId(arr,key,val){ for(var i=0;i<arr.length;i++) if(arr[i][key]===val) return arr[i]; return null; }
  function diffDots(n){ var s=""; for(var i=1;i<=3;i++) s+='<span class="dot'+(i<=n?" on":"")+'"></span>'; return '<span class="diff">'+s+'</span>'; }
  function statusPill(st){ if(st==="reviewed") return '<span class="pill ok">已审</span>'; if(st==="pending") return '<span class="pill warn">AI待审</span>'; return '<span class="pill draft">'+esc(st||"draft")+'</span>'; }

  var KPS = D.knowledge_points, MODS = D.modules, QS = D.questions, CS = D.cases, EDGES = D.edges;
  var modName = {}; MODS.forEach(function(m){ modName[m.module_id]=m.name; });
  var kpTitle = {}; KPS.forEach(function(k){ kpTitle[k.kp_id]=k.title; });
  // edge adjacency
  var adj = {}; KPS.forEach(function(k){ adj[k.kp_id]=[]; });
  EDGES.forEach(function(e){ if(adj[e.from]) adj[e.from].push(e); });

  // ---------- charts (inline SVG) ----------
  function donut(data, colors, size){
    size=size||180; var r=size/2-14, cx=size/2, cy=size/2, total=0, i;
    for(i=0;i<data.length;i++) total+=data[i].v;
    var ns="", ang=-Math.PI/2, circ=2*Math.PI*r;
    for(i=0;i<data.length;i++){
      var frac=data[i].v/total, len=frac*circ;
      ns+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+colors[i%colors.length]+'" stroke-width="16" '+
          'stroke-dasharray="'+len+' '+(circ-len)+'" stroke-dashoffset="'+(-ang*circ)+'" transform="rotate(-90 '+cx+' '+cy+')"></circle>';
      ang+=frac*2*Math.PI;
    }
    ns+='<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" font-size="22" font-weight="800" fill="#1b6ec2">'+total+'</text>';
    ns+='<text x="'+cx+'" y="'+(cy+16)+'" text-anchor="middle" font-size="11" fill="#6b7a90">知识点</text>';
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+ns+'</svg>';
  }
  function hbars(rows, color, max){
    max = max || Math.max.apply(null, rows.map(function(r){return r.v;})) || 1;
    var W=320, rowH=26, pad=92, bw=W-pad-10, H=rows.length*rowH+10;
    var ns="";
    rows.forEach(function(r,i){
      var y=i*rowH+8, w=Math.max(2, r.v/max*bw);
      ns+='<text x="0" y="'+(y+13)+'" font-size="11.5" fill="#1f2d3d">'+esc(r.k)+'</text>';
      ns+='<rect x="'+pad+'" y="'+y+'" width="'+bw+'" height="15" rx="4" fill="#eef3fa"></rect>';
      ns+='<rect x="'+pad+'" y="'+y+'" width="'+w+'" height="15" rx="4" fill="'+color+'"></rect>';
      ns+='<text x="'+(pad+w+5)+'" y="'+(y+13)+'" font-size="11" fill="#6b7a90">'+r.v+'</text>';
    });
    return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+ns+'</svg>';
  }
  function lineChart(series, W){
    W=W||320; var H=150, padL=30, padB=22, padT=12, padR=10;
    var rows=series.map(function(s){return s.data;});
    var maxV=Math.max.apply(null, [].concat.apply([], rows))||1;
    var n=Math.max.apply(null, rows.map(function(r){return r.length;}));
    var plotW=W-padL-padR, plotH=H-padT-padB;
    var ns="";
    // axes
    ns+='<line x1="'+padL+'" y1="'+padT+'" x2="'+padL+'" y2="'+(H-padB)+'" stroke="#e3e9f2"/>';
    ns+='<line x1="'+padL+'" y1="'+(H-padB)+'" x2="'+(W-padR)+'" y2="'+(H-padB)+'" stroke="#e3e9f2"/>';
    for(var g=0;g<=4;g++){ var yy=padT+plotH*g/4; ns+='<text x="2" y="'+(yy+3)+'" font-size="9" fill="#9aa7b8">'+Math.round(maxV*(1-g/4))+'</text>'; }
    var colors=["#1b6ec2","#0fb5ba","#e08a00","#d64545","#7a5cc0","#1f9d55"];
    series.forEach(function(s,si){
      var d="", step=plotW/(n-1);
      s.data.forEach(function(v,i){
        var x=padL+step*i, y=padT+plotH*(1-v/maxV);
        d+=(i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1)+" ";
      });
      ns+='<path d="'+d+'" fill="none" stroke="'+colors[si%colors.length]+'" stroke-width="2.5"/>';
    });
    return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+ns+'</svg>';
  }

  // ---------- TAB: overview ----------
  function renderOverview(){
    var s=D.meta.stats, c=D.course;
    var cards=[
      {n:c.total_hours, l:"总学时", s:'理论 '+c.theory_hours+' / 实验 '+c.lab_hours},
      {n:s.modules, l:"教学模块", s:"M01–M16"},
      {n:s.knowledge_points, l:"知识点", s:"五层知识图谱"},
      {n:s.cases, l:"教学案例", s:'待审 '+s.pending_cases},
      {n:s.questions, l:"题库题目", s:'待审 '+s.pending_questions},
      {n:s.edges, l:"关系边", s:"知识关联"}
    ];
    var grid=h("div",{class:"grid g3"});
    cards.forEach(function(cd){ grid.appendChild(h("div",{class:"stat"},[h("div",{class:"n"},[String(cd.n)]),h("div",{class:"l"},[cd.l]),h("div",{class:"s"},[h("span",{class:"muted"},[cd.s])])])); });

    // layer donut
    var layers=[1,2,3,4,5], layColors=["#1b6ec2","#0fb5ba","#e08a00","#7a5cc0","#1f9d55"];
    var layerData=layers.map(function(L){ return {k:"L"+L, v:KPS.filter(function(k){return k.layer===L;}).length}; });
    // type bars
    var torder=["single","multiple","judge","entry","calc","case","comprehensive","open"];
    var tlabel={single:"单选",multiple:"多选",judge:"判断",entry:"分录",calc:"计算",case:"案例",comprehensive:"综合",open:"开放"};
    var typeRows=torder.map(function(t){ return {k:tlabel[t], v:s.question_types[t]||0}; });

    var callout=h("div",{class:"callout"},[
      h("b",["待教师复核提醒："]),
      ' 当前题库有 '+s.pending_questions+' 道、案例 '+s.pending_cases+' 个由 AI 生成并标记为 pending（依据原则五：AI 生成内容不审不权威）。',
      h("br"),' 请在「练习中心」勾选“包含待审”预览，或于「知识图谱」按状态筛选，复核通过后于数据层将 review_status 改为 approved。'
    ]);

    view.innerHTML="";
    view.appendChild(h("h2",{class:"sec"},[iconBook(),"课程概览"]));
    view.appendChild(grid);
    view.appendChild(h("div",{class:"card"},[callout]));
    var charts=h("div",{class:"grid g2"});
    var legend=h("div",{class:"legend"});
    layerData.forEach(function(d,i){
      legend.appendChild(h("span",{html:'<i style="background:'+layColors[i]+'"></i>L'+d.k.slice(1)+" "+d.v}));
    });
    var donutCard=h("div",{class:"card chart-card"},[
      h("h2",{class:"sec"},["五层知识点分布"]),
      h("div",{html:donut(layerData,layColors,180)}),
      legend
    ]);
    charts.appendChild(donutCard);
    charts.appendChild(h("div",{class:"card chart-card"},[h("h2",{class:"sec"},["题型分布"]), h("div",{html:hbars(typeRows,"#1b6ec2")})]));
    view.appendChild(charts);
    // 课程学习路径（对标会小导·学习中心「四课次学习地图」）
    var lpCard=h("div",{class:"card learn-path"},[
      h("div",{class:"lp-head"},[h("h2",{class:"sec"},[iconGraph(),"课程学习路径"]), h("span",{class:"muted",style:"font-size:12px"},["点击模块进入图谱 / 练习"])])
    ]);
    var lpGrid=h("div",{class:"lp-grid"});
    MODS.slice().sort(function(a,b){ return a.module_id<b.module_id?-1:1; }).forEach(function(m){
      var acts=h("div",{class:"lp-acts"});
      acts.appendChild(h("button",{class:"go-kg",onclick:function(e){e.stopPropagation();kgState.mod=m.module_id;go("kg");}},[ "看图谱" ]));
      acts.appendChild(h("button",{class:"go-quiz",onclick:function(e){e.stopPropagation();go("quiz");}},[ "做练习" ]));
      var body=[ h("div",{class:"lp-name"},[m.module_id+" "+m.name]) ];
      if(m.hours) body.push(h("div",{class:"lp-meta"},["学时 "+m.hours]));
      if(m.description) body.push(h("div",{class:"lp-desc"},[m.description]));
      body.push(acts);
      lpGrid.appendChild(h("div",{class:"lp-item",onclick:function(){kgState.mod=m.module_id;go("kg");}},[ h("div",{class:"lp-id"},[m.module_id]), h("div",{class:"lp-body"},body) ]));
    });
    lpCard.appendChild(lpGrid);
    view.appendChild(lpCard);
  }

  // ---------- TAB: knowledge graph ----------
  var kgState={layer:"",mod:"",status:"",q:""};
  function renderKG(){
    view.innerHTML="";
    view.appendChild(h("h2",{class:"sec"},[iconGraph(),"知识图谱浏览"]));
    // filters
    var f=h("div",{class:"filters"});
    var selL=h("select",{onchange:function(e){kgState.layer=e.target.value;drawKGList();}});
    selL.appendChild(h("option",{value:""},["全部层级"]));
    [1,2,3,4,5].forEach(function(L){ selL.appendChild(h("option",{value:String(L)},["L"+L])); });
    var selM=h("select",{onchange:function(e){kgState.mod=e.target.value;drawKGList();}});
    selM.appendChild(h("option",{value:""},["全部模块"]));
    MODS.forEach(function(m){ selM.appendChild(h("option",{value:m.module_id},[m.module_id+" "+m.name])); });
    var selS=h("select",{onchange:function(e){kgState.status=e.target.value;drawKGList();}});
    [["","全部状态"],["reviewed","仅已审"],["pending","仅待审"]].forEach(function(o){ selS.appendChild(h("option",{value:o[0]},[o[1]])); });
    var inp=h("input",{type:"search",placeholder:"搜索知识点标题 / 编号 / 关键词",oninput:function(e){kgState.q=e.target.value.trim();drawKGList();}});
    f.appendChild(selL); f.appendChild(selM); f.appendChild(selS); f.appendChild(inp);

    spCard.appendChild(lc);
    // mastery heat list
    var mm=sp.mastery_map||{};
    var mmRows=Object.keys(mm).map(function(k){ return {k:k+" "+(kpTitle[k]||""), v:Math.round(mm[k]*100)}; });
    spCard.appendChild(h("div",{class:"chart-card",style:"margin-top:12px"},[h("div",{class:"small muted"},["知识点掌握度（"+mmRows.length+"）"]), h("div",{html:hbars(mmRows,"#1f9d55")})]));
    // experiment progress
    var ep=sp.experiment_progress||[];
    var epDone=ep.filter(function(x){return x.status==="done";}).length;
    spCard.appendChild(h("div",{class:"small muted",style:"margin-top:12px"},["实验完成 "+epDone+" / "+ep.length+" · 学习进度 "+Math.round((sp.progress||0)*100)+"% · AI 互动 "+sp.ai_interactions+" 次"]));
    view.appendChild(spCard);
  }

  // ---------- TAB: review center ----------
  var REVIEW_KEY = "wb_ca_review";
  function loadOverlay(){
    try{ var o=JSON.parse(localStorage.getItem(REVIEW_KEY)||"{}"); return o&&o.questions?o:{questions:{},cases:{}}; }
    catch(e){ return {questions:{},cases:{}}; }
  }
  function saveOverlay(o){ try{ localStorage.setItem(REVIEW_KEY, JSON.stringify(o)); }catch(e){} }

  function renderReview(){
    view.innerHTML="";
    view.appendChild(h("h2",{class:"sec"},[iconWarn(),"复核中心"]));
    var o=loadOverlay();
    var pendingQ = QS.filter(function(q){ return q.review_status==="pending" && !o.questions[q.question_id]; });
    var pendingC = CS.filter(function(c){ return c.review_status==="pending" && !o.cases[c.case_id]; });
    var appQ = Object.keys(o.questions).filter(function(k){ return o.questions[k].status==="approved"; }).length;
    var appC = Object.keys(o.cases).filter(function(k){ return o.cases[k].status==="approved"; }).length;
    var rejQ = Object.keys(o.questions).filter(function(k){ return o.questions[k].status==="rejected"; }).length;
    var rejC = Object.keys(o.cases).filter(function(k){ return o.cases[k].status==="rejected"; }).length;

    var dash=h("div",{class:"dash-grid"});
    [["待审题", pendingQ.length],["已通过题", appQ],["已退例题", rejQ],
     ["待审案例", pendingC.length],["已通过案例", appC],["已退返案例", rejC]]
     .forEach(function(p){ dash.appendChild(h("div",{class:"stat"},[h("div",{class:"n"},[String(p[1])]),h("div",{class:"l"},[p[0]])])); });
    view.appendChild(h("div",{class:"card"},[dash]));

    view.appendChild(h("div",{class:"callout"},[
      h("b",["复核闭环："]),"前端标记「通过 / 退回」后写入本地复核缓存（localStorage），可一键导出 overlay JSON。",
      "教师在本机运行 ", h("code",["python tools/apply_review.py --overlay review.json"]),
      " 即可回写 data/*.json 并自动重新打包前端，使待审计数真实下降。浏览器无法直接执行 Python。"
    ]));

    var expBtn=h("button",{class:"btn sm", onclick:exportOverlay},["导出复核结果 JSON"]);
    view.appendChild(h("div",{class:"row",style:"margin:6px 0 14px"},[expBtn,
      h("span",{class:"small muted"},["已决策：题 "+(appQ+rejQ)+" / 案例 "+(appC+rejC)])]));

    // filters
    var types={}; pendingQ.forEach(function(q){ types[q.type]=(types[q.type]||0)+1; });
    pendingC.forEach(function(c){ types["案例·"+c.type]=(types["案例·"+c.type]||0)+1; });
    var typeSel=h("select",{id:"rvType"},[h("option",{value:""},["全部类型"])]
      .concat(Object.keys(types).map(function(t){ return h("option",{value:t},[t+" ("+types[t]+")"]); })));
    var modSel=h("select",{id:"rvMod"},[h("option",{value:""},["全部模块"])]
      .concat(MODS.map(function(m){ return h("option",{value:m.module_id},[m.module_id+" "+m.name]); })));
    var diffSel=h("select",{id:"rvDiff"},[h("option",{value:""},["全部难度"]),
      h("option",{value:"1"},["低"]),h("option",{value:"2"},["中"]),h("option",{value:"3"},["高"])]);
    function applyFilter(){
      var tv=typeSel.value, mv=modSel.value, dv=diffSel.value;
      var list=view.querySelector("#rvList"); if(!list) return;
      var items=pendingQ.map(function(q){ return {kind:"q",obj:q}; })
        .concat(pendingC.map(function(c){ return {kind:"c",obj:c}; }));
      items=items.filter(function(it){
        var o2=it.obj;
        if(mv && o2.module_id!==mv) return false;
        if(dv && String(o2.difficulty)!==dv) return false;
        if(tv){
          if(it.kind==="q" && o2.type!==tv) return false;
          if(it.kind==="c" && ("案例·"+o2.type)!==tv) return false;
        }
        return true;
      });
      list.innerHTML="";
      if(!items.length){ list.appendChild(h("div",{class:"empty"},["无匹配待审项"])); return; }
      items.forEach(function(it){ list.appendChild(reviewRow(it.kind, it.obj)); });
    }
    typeSel.onchange=applyFilter; modSel.onchange=applyFilter; diffSel.onchange=applyFilter;
    view.appendChild(h("div",{class:"filters"},[typeSel, modSel, diffSel]));

    var list=h("div",{id:"rvList"});
    view.appendChild(list);
    applyFilter();
  }

  function reviewRow(kind, obj){
    var id = kind==="q"? obj.question_id : obj.case_id;
    var typeLabel = kind==="q"? obj.type : ("案例·"+obj.type);
    var row=h("div",{class:"kp"});
    row.appendChild(h("div",{class:"hd"},[
      h("span",{class:"id"},[id]),
      h("span",{class:"tt"},[kind==="q"? (obj.question||"").slice(0,40) : (obj.title||"").slice(0,40)]),
      h("span",{class:"tag"},[typeLabel]),
      h("span",{class:"tag"},[modName[obj.module_id]||obj.module_id]),
      diffDots(obj.difficulty||1),
      statusPill(obj.review_status)
    ]));
    row.appendChild(h("div",{class:"sm"},["知识点："+(kpTitle[obj.kp_id]||obj.kp_id)]));
    var detail=h("div",{class:"detail"});
    if(kind==="q"){
      detail.appendChild(h("div",{class:"small"},["题干："+esc(obj.question||"")]));
      if(obj.options) obj.options.forEach(function(op,idx){ detail.appendChild(h("div",{class:"small"},[String.fromCharCode(65+idx)+". "+esc(op)])); });
      detail.appendChild(h("div",{class:"small"},["答案："+esc(obj.answer)]));
      if(obj.explanation) detail.appendChild(h("div",{class:"exp"},["解析："+esc(obj.explanation)]));
      if(obj.source_refs) detail.appendChild(h("div",{class:"small muted"},["来源："+esc(Array.isArray(obj.source_refs)?obj.source_refs.join(", "):obj.source_refs)]));
    } else {
      if(obj.description) detail.appendChild(h("div",{class:"small"},["描述："+esc(obj.description)]));
      if(obj.question) detail.appendChild(h("div",{class:"small"},["问题："+esc(obj.question)]));
      if(obj.answer||obj.outcome) detail.appendChild(h("div",{class:"exp"},["参考："+esc(obj.answer||obj.outcome)]));
    }
    var okBtn=h("button",{class:"btn sm", onclick:function(){ decide(kind,id,"approved"); }},["标记通过"]);
    var rejBtn=h("button",{class:"btn sm ghost", onclick:function(){ var n=prompt("退回理由（可选）："); decide(kind,id,"rejected", n||""); }},["退回修改"]);
    detail.appendChild(h("div",{class:"row",style:"margin-top:10px"},[okBtn, rejBtn]));
    row.appendChild(detail);
    row.onclick=function(e){ if(e.target.tagName!=="BUTTON") row.classList.toggle("open"); };
    return row;
  }

  function decide(kind, id, status, note){
    var o=loadOverlay();
    var now=new Date().toISOString().slice(0,19);
    if(kind==="q") o.questions[id]={status:status, note:note||"", decided_at:now};
    else o.cases[id]={status:status, note:note||"", decided_at:now};
    saveOverlay(o);
    renderReview();
  }

  function exportOverlay(){
    var o=loadOverlay();
    o.version="1.0"; o.generated_at=new Date().toISOString(); o.reviewer="teacher";
    var blob="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(o,null,2));
    var a=document.createElement("a"); a.href=blob; a.download="review_overlay.json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    alert("已导出复核结果 review_overlay.json。请在本机运行：\npython tools/apply_review.py --overlay review_overlay.json");
  }

  // ---------- 智能助教 (Phase 6 RAG) ----------
  function renderAgent(){
    if(!window.RAG){ view.innerHTML='<div class="card empty">RAG 模块未加载（rag-client.js）。</div>'; return; }
    view.innerHTML="";
    var agents=RAG.AGENTS;
    var sel=h("select",{id:"agSel"}, Object.keys(agents).map(function(a){
      return h("option",{value:a, selected:(a==="teacher-agent")},[agents[a].name+"（"+a+"）"]);
    }));
    var qInput=h("input",{id:"agQ", type:"text", placeholder:"输入问题，如：运输收入什么时候确认？或指定 KP3-001"});
    var kpInput=h("input",{id:"agKp", type:"text", placeholder:"知识点过滤(可选) KP3-001", style:"max-width:170px"});
    var stInput=h("input",{id:"agSt", type:"text", placeholder:"学号(分析用,可选)", style:"max-width:150px"});
    var btn=h("button",{class:"btn", onclick:function(){ runAgent(); }},["咨询"]);
    var filters=h("div",{class:"filters"},[sel, qInput, kpInput, stInput, btn]);
    var intro=h("div",{class:"callout", style:"margin-bottom:14px"},[
      h("b",{},["智能助教 · "]), "8 个教学 Agent 基于本地知识库（知识文档+知识点+案例+题库）离线检索作答。",
      h("br",{}), "来源可追溯；未审核内容（G类/待审）会显著标注，须教师复核后方可纳入正式教学。"
    ]);
    var res=h("div",{id:"agRes"});
    view.appendChild(h("div",{class:"card"},[filters, intro, res]));

    function runAgent(){
      var agent=sel.value, q=qInput.value.trim();
      if(!q){ res.innerHTML='<div class="empty">请输入问题。</div>'; return; }
      var f={}; var kp=kpInput.value.trim().toUpperCase(); if(kp) f.kp_id=kp;
      var st=stInput.value.trim();
      var retrieved=RAG.retrieve(q, {agent:agent, filters:f, top_k:5});
      var out=RAG.answer(agent, q, retrieved, st||null);
      renderOut(out, res);
    }
  }

  function renderOut(o, box){
    box.innerHTML="";
    box.appendChild(h("div",{class:"row", style:"margin-bottom:8px"},[
      h("span",{class:"pill blue"},[o.agent_name]),
      h("span",{class:"muted small"},["查询："+o.query])
    ]));
    box.appendChild(h("div",{class:"exp", style:"white-space:pre-wrap;font-size:14.5px;line-height:1.7"},[o.answer]));
    if(o.warnings && o.warnings.length){
      var w=o.warnings.map(function(x){ return h("li",{class:"small"},["待复核："+x]); });
      box.appendChild(h("div",{class:"callout", style:"margin-top:12px"},[h("b",{},["待复核提醒"]), h("ul",{},w)]));
    }
    if(o.citations && o.citations.length){
      var cit=o.citations.map(function(c){
        var kp=(c.kp_id||[]).join(",")||"-";
        var tag=c.review_status==="pending"?h("span",{class:"tag pending"},["待审"]):"";
        return h("li",{class:"small"},[c.chunk_id+" · 来源"+c.source+" · "+c.type+" · KP:"+kp+" ", tag, " — "+c.title]);
      });
      box.appendChild(h("div",{class:"card", style:"margin-top:12px;background:#f8fbff"},[
        h("div",{class:"muted small"},["引用来源（"+o.citations.length+"）"]), h("ul",{},cit)]));
    }
    if(o.suggested_next && o.suggested_next.length){
      var sg=o.suggested_next.map(function(x){ return h("li",{class:"small"},["→ "+x]); });
      box.appendChild(h("div",{class:"muted", style:"margin-top:10px"},[h("div",{class:"small"},["建议下一步："]), h("ul",{},sg)]));
    }
  }

  // ---------- icons (inline svg path) ----------
  function iconBook(){ return svg('width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1b6ec2" stroke-width="2"><path d="M4 5a2 2 0 0 1 2-2h5v18H6a2 2 0 0 1-2-2z"/><path d="M20 5a2 2 0 0 0-2-2h-5v18h5a2 2 0 0 0 2-2z"/></svg>'); }
  function iconGraph(){ return svg('width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1b6ec2" stroke-width="2"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="7" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8 7l8 0M7 8l4 8M17 9l-4 7"/></svg>'); }
  function iconQuiz(){ return svg('width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1b6ec2" stroke-width="2"><path d="M9 11l2 2 4-4"/><rect x="4" y="4" width="16" height="16" rx="3"/></svg>'); }
  function iconDash(){ return svg('width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1b6ec2" stroke-width="2"><rect x="4" y="4" width="7" height="10" rx="1"/><rect x="13" y="4" width="7" height="6" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/><rect x="4" y="17" width="7" height="3" rx="1"/></svg>'); }
  function iconWarn(){ return svg('width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e08a00" stroke-width="2"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg>'); }
  function iconBulb(){ return svg('width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1b6ec2" stroke-width="2"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 1 4 10c-1 1-1 2-1 3H9c0-1 0-2-1-3A6 6 0 0 1 12 3z"/></svg>'); }
  function iconUser(){ return svg('width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1b6ec2" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>'); }

  // ---------- router ----------
  var tabs={overview:renderOverview, kg:renderKG, quiz:renderQuiz, dash:renderDash, review:renderReview, agent:renderAgent};
  function go(tab){
    document.querySelectorAll("#nav button").forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-tab")===tab); });
    (tabs[tab]||renderOverview)();
    window.scrollTo(0,0);
  }
  document.getElementById("nav").addEventListener("click", function(e){ if(e.target.getAttribute("data-tab")) go(e.target.getAttribute("data-tab")); });
  go("overview");
})();
</script>
