<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>民用航空运输企业会计 · 智能教学平台</title>
<meta name="theme-color" content="#1b6ec2" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<style>
  :root{
    --bg:#eef3fa; --card:#ffffff; --ink:#1f2d3d; --muted:#6b7a90;
    --primary:#1b6ec2; --primary-d:#155a9e; --accent:#0fb5ba;
    --ok:#1f9d55; --warn:#e08a00; --danger:#d64545; --line:#e3e9f2;
    --chip:#eaf2fc; --radius:14px; --shadow:0 2px 10px rgba(31,45,61,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); font-size:15px; line-height:1.55;
    -webkit-text-size-adjust:100%;
  }
  a{color:var(--primary);text-decoration:none}
  .wrap{max-width:1120px;margin:0 auto;padding:0 16px}
  header.top{
    background:linear-gradient(135deg,var(--primary),var(--primary-d));
    color:#fff;padding:18px 0 14px;box-shadow:var(--shadow);
  }
  header.top h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.5px}
  header.top .sub{font-size:13px;opacity:.9;margin-top:3px}
  header.top .ver{display:inline-block;margin-top:6px;font-size:12px;background:rgba(255,255,255,.18);
    padding:2px 10px;border-radius:20px}
  nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;position:sticky;top:0;
    background:var(--bg);z-index:20;border-bottom:1px solid var(--line)}
  nav.tabs button{
    flex:0 0 auto;border:none;background:transparent;color:var(--muted);font-size:14px;
    padding:9px 16px;border-radius:20px;cursor:pointer;font-weight:600;min-height:44px;
  }
  nav.tabs button.active{background:var(--primary);color:#fff}
  main{padding:18px 0 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}}
  @media(max-width:480px){.g2,.g3,.g4{grid-template-columns:1fr}}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;box-shadow:var(--shadow)}
  .stat .n{font-size:26px;font-weight:800;color:var(--primary)}
  .stat .l{font-size:12.5px;color:var(--muted);margin-top:2px}
  .stat .s{font-size:11.5px;margin-top:4px}
  .pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600}
  .pill.ok{background:#e6f6ec;color:var(--ok)}
  .pill.warn{background:#fdf2dd;color:var(--warn)}
  .pill.draft{background:#eef1f6;color:var(--muted)}
  .pill.blue{background:var(--chip);color:var(--primary)}
  h2.sec{font-size:17px;margin:6px 0 12px;display:flex;align-items:center;gap:8px}
  h2.sec svg{width:20px;height:20px;flex:0 0 auto}
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .filters select,.filters input{
    border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;
    background:#fff;color:var(--ink);min-height:42px}
  .filters input{flex:1;min-width:160px}
  button.btn{border:none;background:var(--primary);color:#fff;font-weight:700;
    padding:10px 18px;border-radius:10px;cursor:pointer;font-size:14px;min-height:44px}
  button.btn.ghost{background:#fff;color:var(--primary);border:1px solid var(--primary)}
  button.btn.sm{padding:7px 12px;font-size:13px;min-height:38px}
  button.btn:active{transform:translateY(1px)}
  button.link{background:none;border:none;color:var(--primary);cursor:pointer;font-size:13px;padding:4px 6px}
  .kp{border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:#fff;transition:.15s}
  .kp:hover{border-color:var(--primary)}
  .kp .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .kp .id{font-size:11.5px;font-weight:700;color:var(--primary);background:var(--chip);
    padding:2px 8px;border-radius:6px}
  .kp .tt{font-weight:700;font-size:15px;flex:1}
  .kp .ly{font-size:11px;color:var(--muted)}
  .kp .sm{color:var(--muted);font-size:13.5px;margin-top:6px}
  .kp .detail{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
  .kp.open .detail{display:block}
  .kp .kpis{font-size:12.5px;color:var(--ink)}
  .kp .kpis li{margin:3px 0}
  .diff{display:inline-flex;gap:2px;vertical-align:middle}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
  .dot.on{background:var(--warn)}
  .chart-card{display:flex;flex-direction:column;align-items:center}
  .legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:8px;justify-content:center}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
  .quiz-q{font-size:16px;font-weight:600;margin-bottom:12px}
  .opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;
    border-radius:10px;padding:12px 14px;margin-bottom:9px;cursor:pointer;font-size:14.5px;min-height:46px}
  .opt:hover{border-color:var(--primary)}
  .opt.sel{border-color:var(--primary);background:var(--primary);color:#fff;font-weight:600}
  .opt.sel .tk{color:#fff}
  .opt.right{background:#e6f6ec;border-color:var(--ok)}
  .opt.wrong{background:#fdeaea;border-color:var(--danger)}
  .opt .tk{font-weight:700;margin-right:8px;color:var(--primary)}
  .exp{background:#f6f9fd;border-left:3px solid var(--primary);padding:10px 12px;border-radius:6px;
    font-size:13.5px;color:var(--ink);margin-top:10px}
  #ansBox{margin-top:10px}
  .adv{color:var(--danger);font-weight:600;font-size:13px;margin-right:8px}
  .qmeta{font-size:12px;color:var(--muted);margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap}
  .prog{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0}
  .prog>i{display:block;height:100%;background:var(--primary);width:0}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .muted{color:var(--muted)}
  .small{font-size:12.5px}
  .callout{border:1px solid #f4d9a6;background:#fff8ec;border-radius:12px;padding:14px 16px}
  .callout b{color:var(--warn)}
  table.t{width:100%;border-collapse:collapse;font-size:13px}
  table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left}
  table.t th{color:var(--muted);font-weight:600}
  .score-big{font-size:46px;font-weight:800;color:var(--primary);text-align:center}
  .tag{font-size:11px;padding:1px 7px;border-radius:6px;background:#eef1f6;color:var(--muted);margin-left:6px}
  .tag.pending{background:#fdf2dd;color:var(--warn)}
  .hidden{display:none}
  .dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .footer{text-align:center;color:var(--muted);font-size:12px;padding:18px 0 40px}
  .empty{padding:30px;text-align:center;color:var(--muted)}
  @media(max-width:760px){
    .stat .n{font-size:22px}
    header.top h1{font-size:18px}
  }
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
  .course-switch{display:flex;gap:8px;margin-top:10px}
  .cs-btn{border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:#fff;font-size:13px;font-weight:600;
    padding:6px 16px;border-radius:20px;cursor:pointer;min-height:36px}
  .cs-btn.active{background:#fff;color:var(--primary)}
  .flow{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;margin-top:6px}
  .flow-step{flex:1;min-width:150px;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .flow-arrow{display:flex;align-items:center;font-size:20px;color:var(--primary);font-weight:700}
  .ans-key{font-size:13.5px;line-height:1.5}
  /* 课程大纲 */
  .ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:12px}
  .ch-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 15px;box-shadow:var(--shadow)}
  .ch-card h4{margin:0 0 8px;font-size:15px;color:var(--primary)}
  .ch-card .meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .ch-card .badge{font-size:11px;padding:2px 9px;border-radius:20px;background:var(--chip);color:var(--primary);font-weight:600}
  .ch-card .badge.core{background:#fde8e8;color:var(--danger)}
  .ch-card .lbl{font-weight:700;color:var(--ink);font-size:12.5px;margin-top:9px;display:block}
  .ch-card ul{margin:5px 0 0;padding-left:18px;font-size:13px;line-height:1.5}
  .h3{font-size:14.5px;font-weight:700;margin:15px 0 6px;color:var(--primary-d)}
  .code{background:#0f172a;color:#e2e8f0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;
    line-height:1.5;padding:12px 14px;border-radius:10px;white-space:pre-wrap;overflow:auto}
  .syl-note{font-size:13px;line-height:1.6}
  .modal{background:#fff;border-radius:14px;max-width:600px;width:100%;max-height:82vh;  overflow:auto;padding:18px 20px;box-shadow:0 14px 44px rgba(0,0,0,.22)}
  @media print{
    nav.tabs, .footer, .btn, button, input, select{display:none !important}
    body{background:#fff}
    header.top{background:#fff;color:#1f2d3d;box-shadow:none}
    header.top .ver{display:none}
    .card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
    .grid{display:block}
    .grid .card{margin-bottom:10px}
    .callout{background:#f4f7fb;border:1px solid #ddd}
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1 id="appTitle">民用航空运输企业会计 · 智能教学平台</h1>
    <div class="sub" id="appSub">知识图谱驱动的智能课程系统</div>
    <div class="ver" id="appVer">Phase 7 · 部署上线</div>
    <div class="course-switch" id="courseSwitch"></div>
  </div>
</header>

<nav class="tabs wrap" id="nav">
  <button data-tab="overview" class="active">概览</button>
  <button data-tab="syllabus">课程大纲</button>
  <button data-tab="kg">知识图谱</button>
  <button data-tab="quiz">练习中心</button>
  <button data-tab="mistakes">错题本</button>
  <button data-tab="daily">每日一题</button>
  <button data-tab="roadmap">学习路线</button>
  <button data-tab="paper">试卷中心</button>
  <button data-tab="autoexam">智能评阅</button>
  <button data-tab="grade">成绩报表</button>
  <button data-tab="mine">我的</button>
  <button data-tab="dash">教师驾驶舱</button>
  <button data-tab="review">复核中心</button>
  <button data-tab="agent">智能助教</button>
</nav>

<main class="wrap" id="view"></main>

<footer class="footer">
  数据本地离线运行 · 全部内容以教师复核（reviewed）为准 · AI 生成内容标记为待审（pending）<br />
  可「添加到主屏幕」离线使用；学习进度仅存本机浏览器，建议定期在「我的」导出学习报告。
</footer>

<script src="data.bundle.js"></script>
<script src="rag-client.js"></script>
<script src="logistics-syllabus.js"></script>
<script src="la-data.js"></script>
<script>
(function(){
  "use strict";
  var COURSE = (localStorage.getItem("CA_COURSE") || "CA");
  var D = (COURSE === "LA" && window.LA_DATA) ? window.LA_DATA : window.APP_DATA;
  var view = document.getElementById("view");
  if(!D){ view.innerHTML = '<div class="card empty">未加载数据（data.bundle.js）。请确认本文件与 data.bundle.js 在同一目录。</div>'; return; }

  // ---------- course switch (CA / LA) ----------
  function applyCourseMeta(){
    if(COURSE==="LA"){
      // 封面统一：只用一个课程名"民用航空运输企业会计"，当前所选课程由"民航会计/物流会计"切换按钮体现
      document.getElementById("appTitle").textContent="民用航空运输企业会计 · 智能教学平台";
      document.getElementById("appSub").textContent="智能体功能闭环：题库 → 组卷 → 自动评阅 → 成绩";
      document.getElementById("appVer").textContent="智能教学闭环 v2 · 双课程（民航 / 物流）";
    }
  }
  function renderCourseSwitch(){
    var box=document.getElementById("courseSwitch"); if(!box) return;
    box.innerHTML="";
    [["CA","民航会计"],["LA","物流会计"]].forEach(function(c){
      var b=h("button",{class:"cs-btn"+(COURSE===c[0]?" active":""), onclick:function(){
        if(COURSE===c[0]) return;
        localStorage.setItem("CA_COURSE",c[0]); location.reload();
      }},[c[1]]);
      box.appendChild(b);
    });
  }
  applyCourseMeta(); renderCourseSwitch();

  // ---------- helpers ----------
  function h(tag, attrs, kids){
    var e=document.createElement(tag);
    if(attrs) for(var k in attrs){ if(k==="html") e.innerHTML=attrs[k]; else if(k==="class") e.className=attrs[k]; else if(k==="onclick") e.onclick=attrs[k]; else e.setAttribute(k,attrs[k]); }
    if(kids){ if(!Array.isArray(kids)) kids=[kids]; kids.forEach(function(c){ if(c==null) return; e.appendChild(typeof c==="string"?document.createTextNode(c):c); }); }
    return e;
  }
  function svg(markup){ var d=document.createElement("div"); d.innerHTML='<svg xmlns="http://www.w3.org/2000/svg" '+markup+'</svg>'; return d.firstChild; }
  function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); }
  function byId(arr,key,val){ for(var i=0;i<arr.length;i++) if(arr[i][key]===val) return arr[i]; return null; }
  function diffDots(n){ var s=""; for(var i=1;i<=3;i++) s+='<span class="dot'+(i<=n?" on":"")+'"></span>'; return '<span class="diff">'+s+'</span>'; }
  function statusPill(st){ if(st==="reviewed") return '<span class="pill ok">已审</span>'; if(st==="pending") return '<span class="pill warn">AI待审</span>'; return '<span class="pill draft">'+esc(st||"draft")+'</span>'; }

  var KPS = D.knowledge_points || [], MODS = D.modules || [], QS = D.questions || [], CS = D.cases || [], EDGES = D.edges || [];
  var modName = {}; MODS.forEach(function(m){ modName[m.module_id]=m.name; });
  var kpTitle = {}; KPS.forEach(function(k){ kpTitle[k.kp_id]=k.title; });
  // edge adjacency
  var adj = {}; KPS.forEach(function(k){ adj[k.kp_id]=[]; });
  EDGES.forEach(function(e){ if(adj[e.from]) adj[e.from].push(e); });

  // ---------- 个人学习存储 (localStorage, 离线) ----------
  var STORE_KEY = "ca_student_store_v1";
  function loadStore(){
    try { var raw = localStorage.getItem(STORE_KEY); if(raw){ var s = JSON.parse(raw); if(s && typeof s==="object") return s; } } catch(e){}
    return null;
  }
  var STORE = loadStore() || { start:"", checkins:[], mistakes:[], roadmap:{}, daily:{}, profile:{name:"",sid:""}, server:"" };
  function saveStore(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(STORE)); } catch(e){} }
  // Phase 9: 上报本机进度到后端
  function doReport(name, sid, server){
    if(!server){ alert("请先填写「上报服务器地址」"); return; }
    if(!name){ alert("请先填写「姓名/昵称」"); return; }
    STORE.profile = {name:(name||"").trim(), sid:(sid||"").trim()};
    STORE.server = (server||"").trim().replace(/\/$/,"");
    saveStore();
    var base = STORE.server;
    fetch(base + "/api/report", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(STORE)
    }).then(function(r){ return r.json(); }).then(function(j){
      if(j && j.ok){ alert("✅ 上报成功：" + (j.name||name) + "（已更新）"); }
      else { alert("上报失败：" + ((j&&j.error)||"未知错误")); }
    }).catch(function(e){ alert("上报失败（网络/跨域）：" + e); });
  }
  // Phase 9: 教师端拉取实时看板
  function fetchLive(base){
    base=(base||"").trim().replace(/\/$/,"");
    if(!base){ alert("请填写后端服务器地址"); return; }
    fetch(base + "/api/class").then(function(r){ return r.json(); }).then(function(j){
      if(j && j.students){ renderLiveDash(j.students, base); }
      else { alert("拉取失败：" + ((j&&j.error)||"无数据")); }
    }).catch(function(e){ alert("拉取失败（网络/跨域）：" + e); });
  }
  function renderLiveDash(students, base){
    view.innerHTML="";
    view.appendChild(h("h2",{class:"sec"},[iconDash(),"教师驾驶舱 · 实时看板"]));
    view.appendChild(h("div",{class:"callout"},["数据源：" + base + " · 共 " + students.length + " 位学生已上报 · 数据为各学生本机进度快照"]));
    var tc=0,tm=0,tma=0,tr=0;
    students.forEach(function(s){ tc+=s.stats.checkin_days; tm+=s.stats.mistakes; tma+=s.stats.mastered; tr+=s.stats.roadmap_done; });
    var grid=h("div",{class:"dash-grid"});
    [["已上报学生",students.length],["累计打卡(人次)",tc],["累计错题",tm],["已掌握",tma],["路线图完成(人次)",tr]]
      .forEach(function(p){ grid.appendChild(h("div",{class:"stat"},[h("div",{class:"n"},[String(p[1])]),h("div",{class:"l"},[p[0]])])); });
    view.appendChild(h("div",{class:"card"},[grid]));
    var list=h("div",{class:"card",style:"margin-top:14px"});
    list.appendChild(h("h2",{class:"sec"},["学生明细"]));
    var tbl=h("table",{class:"t"});
    tbl.appendChild(h("tr",[h("th",["姓名"]),h("th",["学号"]),h("th",["班级"]),h("th",["打卡"]),h("th",["错题"]),h("th",["已掌握"]),h("th",["路线图"]),h("th",["最近活跃"]),h("th",["操作"])]));
    students.forEach(function(s){
      var tr2=h("tr");
      tr2.appendChild(h("td",[s.name])); tr2.appendChild(h("td",[s.sid]));
      tr2.appendChild(h("td",[s.class])); tr2.appendChild(h("td",[String(s.stats.checkin_days)]));
      tr2.appendChild(h("td",[String(s.stats.mistakes)])); tr2.appendChild(h("td",[String(s.stats.mastered)]));
      tr2.appendChild(h("td",[String(s.stats.roadmap_done)])); tr2.appendChild(h("td",[s.stats.last_active||"—"]));
      tr2.appendChild(h("td",[h("button",{class:"btn sm", onclick:function(){ showStudentDetail(s); }},["查看"])]));
      tbl.appendChild(tr2);
    });
    list.appendChild(tbl);
    view.appendChild(list);
  }
  function showStudentDetail(s){
    var r=s.raw||{}, rm=r.roadmap||{}, done=0;
    MODS.forEach(function(m){ var v=rm[m.module_id]; if((v&&typeof v==="object"&&v.done)||v==="done") done++; });
    var box=h("div");
    box.appendChild(h("h3",{class:"sec",style:"margin-top:0"},["学生详情 · " + s.name + "（" + s.sid + "）"]));
    box.appendChild(h("div",{class:"small muted"},["班级：" + (s.class||"—") + " · 路线图完成 " + done + "/" + MODS.length + " · 最近活跃 " + (s.stats.last_active||"—")]));
    var ms=r.mistakes||[];
    box.appendChild(h("div",{class:"small muted",style:"margin-top:8px"},["错题 " + ms.length + " 条（近 30）"]));
    var ul=h("ul",{class:"kpis"});
    ms.slice(0,30).forEach(function(m){
      var q=byId(QS,"question_id",m.qid)||{};
      ul.appendChild(h("li",[(m.master?"✅ ":"❌ ") + ((q.stem||m.qid)||"").slice(0,60) + "（" + (kpTitle[m.kp]||m.kp||"") + "）"]));
    });
    box.appendChild(ul);
    if(ms.length>30) box.appendChild(h("div",{class:"small muted"},["… 其余 " + (ms.length-30) + " 条"]));
    openModal(box);
  }
  function openModal(node){
    var ov=h("div",{class:"overlay"});
    var box=h("div",{class:"modal"});
    box.appendChild(node);
    box.appendChild(h("div",{class:"row",style:"margin-top:14px"},[h("button",{class:"btn",onclick:function(){ ov.remove(); }},["关闭"])]));
    ov.onclick=function(e){ if(e.target===ov) ov.remove(); };
    ov.appendChild(box);

  // ---------- charts (inline SVG) ----------
  function donut(data, colors, size){
    size=size||180; var r=size/2-14, cx=size/2, cy=size/2, total=0, i;
    for(i=0;i<data.length;i++) total+=data[i].v;
    var ns="", ang=-Math.PI/2, circ=2*Math.PI*r;
    for(i=0;i<data.length;i++){
      var frac=data[i].v/total, len=frac*circ;
      ns+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+colors[i%colors.length]+'" stroke-width="16" '+
          'stroke-dasharray="'+len+' '+(circ-len)+'" stroke-dashoffset="'+(-ang*circ)+'" transform="rotate(-90 '+cx+' '+cy+')"></circle>';
      ang+=frac*2*Math.PI;
    }
    ns+='<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" font-size="22" font-weight="800" fill="#1b6ec2">'+total+'</text>';
    ns+='<text x="'+cx+'" y="'+(cy+16)+'" text-anchor="middle" font-size="11" fill="#6b7a90">知识点</text>';
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+ns+'</svg>';
  }
  function hbars(rows, color, max){
    max = max || Math.max.apply(null, rows.map(function(r){return r.v;})) || 1;
    var W=320, rowH=26, pad=92, bw=W-pad-10, H=rows.length*rowH+10;
    var ns="";
    rows.forEach(function(r,i){
      var y=i*rowH+8, w=Math.max(2, r.v/max*bw);
      ns+='<text x="0" y="'+(y+13)+'" font-size="11.5" fill="#1f2d3d">'+esc(r.k)+'</text>';
      ns+='<rect x="'+pad+'" y="'+y+'" width="'+bw+'" height="15" rx="4" fill="#eef3fa"></rect>';
      ns+='<rect x="'+pad+'" y="'+y+'" width="'+w+'" height="15" rx="4" fill="'+color+'"></rect>';
      ns+='<text x="'+(pad+w+5)+'" y="'+(y+13)+'" font-size="11" fill="#6b7a90">'+r.v+'</text>';
    });
    return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+ns+'</svg>';
  }
  function lineChart(series, W){
    W=W||320; var H=150, padL=30, padB=22, padT=12, padR=10;
    var rows=series.map(function(s){return s.data;});
    var maxV=Math.max.apply(null, [].concat.apply([], rows))||1;
    var n=Math.max.apply(null, rows.map(function(r){return r.length;}));
    var plotW=W-padL-padR, plotH=H-padT-padB;
    var ns="";
    // axes
    ns+='<line x1="'+padL+'" y1="'+padT+'" x2="'+padL+'" y2="'+(H-padB)+'" stroke="#e3e9f2"/>';
    ns+='<line x1="'+padL+'" y1="'+(H-padB)+'" x2="'+(W-padR)+'" y2="'+(H-padB)+'" stroke="#e3e9f2"/>';
    for(var g=0;g<=4;g++){ var yy=padT+plotH*g/4; ns+='<text x="2" y="'+(yy+3)+'" font-size="9" fill="#9aa7b8">'+Math.round(maxV*(1-g/4))+'</text>'; }
    var colors=["#1b6ec2","#0fb5ba","#e08a00","#d64545","#7a5cc0","#1f9d55"];
    series.forEach(function(s,si){
      var d="", step=plotW/(n-1);
      s.data.forEach(function(v,i){
        var x=padL+step*i, y=padT+plotH*(1-v/maxV);
        d+=(i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1)+" ";
      });
      ns+='<path d="'+d+'" fill="none" stroke="'+colors[si%colors.length]+'" stroke-width="2.5"/>';
    });
    return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+ns+'</svg>';
  }

  // 通用单题面板：用于每日一题 / 错题本重练（复用 .opt/.exp/.quiz-q 样式）
  function qPanel(q, opt){
    opt = opt || {};
    var wrap=h("div",{class:"qpanel", style:"margin-top:8px"});
    wrap.appendChild(h("div",{class:"quiz-q"},[q.stem]));
    var sel={}, optsArr=[], objective=["single","multiple","judge","entry","calc","case","comprehensive"].indexOf(q.type)>=0;
    var optKeys=[];
    if(q.options){ for(var k in q.options){ if(q.options.hasOwnProperty(k)) optKeys.push(k); } }
    optKeys.sort();
    if(!optKeys.length){
      var ansBox0=h("div",{class:"exp", style:"display:none;margin-top:10px"});
      wrap.appendChild(h("button",{class:"btn", onclick:function(){
        ansBox0.style.display="block"; ansBox0.innerHTML="";
        ansBox0.appendChild(h("div",{class:"muted small"},["参考答案："]));
        ansBox0.appendChild(h("div",[q.answer||"—"]));
        if(q.explanation) ansBox0.appendChild(h("div",{style:"margin-top:6px"},["解析："+q.explanation]));
        markCheckin(5, q.kp_id);
        if(opt.onResult) opt.onResult(true);
      }},["查看答案 / 完成"]));
      wrap.appendChild(ansBox0);
      return wrap;
    }
    optKeys.forEach(function(key){
      var o=h("button",{class:"opt"});
      o.appendChild(h("span",{class:"tk"},[(q.type==="multiple"?"☐":"")]));
      o.appendChild(document.createTextNode(key+". "+(q.options[key]||"")));
      o.onclick=function(){
        if(o.disabled) return;
        if(q.type==="multiple"){ sel[key]=!sel[key]; o.classList.toggle("sel",!!sel[key]); var t=o.querySelector(".tk"); if(t) t.textContent=sel[key]?"☑":"☐"; }
        else { for(var kk in sel) delete sel[kk]; sel[key]=true; optsArr.forEach(function(x){x.el.classList.remove("sel");}); o.classList.add("sel"); }
      };
      o._key=key; o.el=o; optsArr.push(o); wrap.appendChild(o);
    });
    var ansBox=h("div",{class:"exp", style:"display:none"}); wrap.appendChild(ansBox);
    var subBtn=h("button",{class:"btn", style:"margin-top:10px", onclick:function(){ submitOne(); }},["提交答案"]);
    wrap.appendChild(subBtn);
    function isCorrectKey(qq,k){ var a=qq.answer; if(Array.isArray(a)) return a.indexOf(k)>=0; if(typeof a==="string"){ return a.split(/[,，;；]/).map(function(x){return x.trim();}).indexOf(k)>=0; } return false; }
    function submitOne(){
      var correct=true;
      if(q.type==="multiple"){ var keys=optKeys.filter(function(k){return sel[k];}); var ca=Array.isArray(q.answer)?q.answer:((""+q.answer).split(/[,，;；]/).map(function(x){return x.trim();})); correct=(keys.length===ca.length)&&keys.every(function(k){return ca.indexOf(k)>=0;}); }
      else if(objective){ var ans=Array.isArray(q.answer)?q.answer[0]:(""+q.answer).trim(); correct=!!sel[ans]; }
      else correct=false;
      optsArr.forEach(function(o){ var key=o._key; if(isCorrectKey(q,key)) o.classList.add("right"); else if(sel[key]) o.classList.add("wrong"); o.disabled=true; });
      subBtn.disabled=true;
      ansBox.style.display="block"; ansBox.innerHTML="";
      if(objective){ ansBox.appendChild(h("div",["正确答案："+answerText(q)])); }
      else { ansBox.appendChild(h("div",{class:"muted small"},["参考答案："])); ansBox.appendChild(h("div",[q.answer||"—"])); }
      if(q.explanation) ansBox.appendChild(h("div",{style:"margin-top:6px"},["解析："+q.explanation]));
      ansBox.appendChild(h("div",{class:"row", style:"margin-top:10px"},[h("span",{class:"small"},[correct?"✅ 答对":"❌ 答错"])]));
      if(!correct){ ansBox.appendChild(h("button",{class:"btn sm", style:"margin-left:8px", onclick:function(){ if(addMistake(q.question_id,"")) alert("已加入错题本"); else alert("已在错题本中"); }},["加入错题本"])); }
      markCheckin(5, q.kp_id);
      if(opt.onResult) opt.onResult(correct);
      setTimeout(function(){ ansBox.scrollIntoView({block:"center",behavior:"smooth"}); },50);
    }
    return wrap;
  }

  // ============ LA 智能体功能闭环：试卷中心 / 智能评阅 / 成绩报表 ============
  var PAPER=null;
  function laQuestions(){ return (window.LA_DATA && window.LA_DATA.questions) || []; }
  function laRules(){ return (window.LA_DATA && window.LA_DATA.paper_rules) || {}; }
  function rngFrom(seed){ var s=(seed||1)>>>0||1; return function(){ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
  function pickJS(pool,n,dw,rnd){
    if(!pool.length||n<=0) return [];
    var byDiff={easy:[],medium:[],hard:[]}; pool.forEach(function(q){ byDiff[q.difficulty].push(q); });
    var order=["easy","medium","hard"], total=order.reduce(function(a,d){return a+(dw[d]||0);},0)||1, chosen=[];
    order.sort(function(a,b){return (dw[b]||0)-(dw[a]||0);}).forEach(function(d){
      var want=Math.round(n*(dw[d]||0)/total);
      var avail=byDiff[d].filter(function(q){return chosen.indexOf(q)<0;});
      for(var i=avail.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1));var t=avail[i];avail[i]=avail[j];avail[j]=t;}
      chosen=chosen.concat(avail.slice(0,want));
    });
    var remain=pool.filter(function(q){return chosen.indexOf(q)<0;});
    for(var i=remain.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1));var t=remain[i];remain[i]=remain[j];remain[j]=t;}
    return chosen.concat(remain.slice(0,Math.max(0,n-chosen.length))).slice(0,n);
  }
  function genPaperJS(name,seed){
    var rules=laRules(), tpl=rules[name]; if(!tpl) return null;
    var rnd=rngFrom(seed), Q=laQuestions(), pool=Q.slice();
    if(tpl.coverage==="sampled"){
      var chs=[]; for(var c=1;c<=9;c++) chs.push(c);
      for(var i=chs.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1));var t=chs[i];chs[i]=chs[j];chs[j]=t;}
      pool=Q.filter(function(q){return chs.slice(0,4).indexOf(q.chapter)>=0;});
    }
    var chosen=[];
    Object.keys(tpl.mix).forEach(function(t){ var n=tpl.mix[t]; var p=pool.filter(function(q){return q.type===t && chosen.indexOf(q)<0;}); chosen=chosen.concat(pickJS(p,n,tpl.difficulty,rnd)); });
    var to={single:0,multiple:1,judge:2,term:3,essay:4,calc:5,case:6};
    chosen.sort(function(a,b){return (a.chapter-b.chapter)||((to[a.type]||9)-(to[b.type]||9));});
    var total=chosen.reduce(function(a,q){return a+(q.score||0);},0);
    return {paper_id:"LA-PAPER-"+name+"-"+(seed||"rand"), template:name, title:"物流企业会计（第六版）"+name, duration:tpl.duration, purpose:tpl.purpose, total_score:total, question_count:chosen.length,
      questions:chosen.map(function(q,i){return {seq:i+1,qid:q.question_id,chapter:q.chapter,kp_id:q.kp_id,type:q.type,type_cn:q.type_cn,score:q.score,difficulty:q.difficulty,stem:q.stem,options:q.options,answer:q.answer,reference_answer:q.reference_answer,rubric:q.rubric};})};
  }
  // ---- JS 评阅（客观精确 + 主观分步） ----
  var STOPSET=new Set("的了吗呢吧啊和与及或并把被在对于该各其及以及之间是也都有为以可应即如若等其此这那所".split(""));
  function extractNumsJS(s){ if(!s) return []; var m=s.match(/\d+(?:\.\d+)?\s*(?:万|元|%|个|年|倍)?/g)||[]; return m.map(function(x){return x.replace(/ /g,"");}); }
  function extractAcctJS(s){ if(!s) return []; return s.match(/(?:借|贷)\s*[:：]\s*[\u4e00-\u9fa5（）、，]+?(?=\s|$)/g)||[]; }
  function kwsJS(s){ if(!s) return []; var t=s.replace(/[^\u4e00-\u9fa5]/g," "); var toks=t.match(/[\u4e00-\u9fa5]{2,4}/g)||[]; var out=[],seen={}; toks.forEach(function(w){ if(!STOPSET.has(w)&&!seen[w]){seen[w]=1;out.push(w);} }); return out; }
  function intersectJS(a,b){ var c=0; a.forEach(function(x){ if(b.indexOf(x)>=0) c++; }); return c; }
  function stepCoveredJS(text,s){
    var sn=new Set(extractNumsJS(text));
    var numHit=s.numbers.length?(intersectJS(s.numbers,Array.from(sn))/s.numbers.length):0;
    var st=new Set(kwsJS(text));
    var termHit=s.terms.length?(intersectJS(s.terms,Array.from(st))/s.terms.length):0;
    var sa=new Set(extractAcctJS(text));
    var acctHit=s.accounts.length?(intersectJS(s.accounts,Array.from(sa))/s.accounts.length):0;
    if(s.accounts.length||s.numbers.length) return Math.max(numHit,acctHit)>=0.5 || termHit>=0.6;
    return termHit>=0.5;
  }
  function eqSet(a,b){ a=a||[];b=b||[]; if(a.length!==b.length) return false; var sa=a.map(function(x){return String(x).toUpperCase();}).sort(), sb=b.map(function(x){return String(x).toUpperCase();}).sort(); return sa.every(function(x,i){return x===sb[i];}); }
  function gradeObjectiveJS(q,ans){
    if(q.type==="multiple") return eqSet(ans||[],q.answer);
    if(q.type==="judge") return String(ans).trim()===String(judgeCorrectLabel(q));
    return String(ans).trim().toUpperCase()===String(q.answer).trim().toUpperCase();
  }
  function gradeSubjectiveJS(q,text){
    var rub=q.rubric, maxs=q.score||0;
    if(!rub||!rub.steps||!rub.steps.length) return {earned:0,max:maxs,hits:[]};
    var steps=rub.steps, per=maxs/steps.length, earned=0, hits=[];
    steps.forEach(function(s){ var ok=stepCoveredJS(text||"",s); hits.push(ok); if(ok) earned+=per; });
    return {earned:Math.round(earned*10)/10,max:maxs,hits:hits};
  }

          Object.keys(it.options).forEach(function(k){ if(!it.options[k]) return; var o=h("button",{class:"opt",onclick:function(){ var on=o.classList.toggle("sel"); if(on){ (ans[it.qid]=ans[it.qid]||[]).push(k); } else { ans[it.qid]=(ans[it.qid]||[]).filter(function(x){return x!==k;}); } }}); qwrap.appendChild(o); });

          Object.keys(it.options).forEach(function(k){ if(!it.options[k]) return; var o=h("button",{class:"opt",onclick:function(){ qwrap.querySelectorAll(".opt").forEach(function(x){x.classList.remove("sel");}); o.classList.add("sel"); ans[it.qid]=k; }}); qwrap.appendChild(o); });
        }
      } else {
        var ta=h("textarea",{rows:"3",style:"width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:inherit"});
        ta.oninput=function(){ ans[it.qid]=ta.value; }; qwrap.appendChild(ta);
      }
      box.appendChild(qwrap);
    });
    view.appendChild(box);
    view.appendChild(h("button",{class:"btn",style:"margin-top:8px",onclick:function(){ runGrade(); }},["提交评阅"]));
    view.appendChild(h("div",{id:"examResult",style:"margin-top:14px"}));
  }
  function runGrade(){
    var ans=window.__examAnswers||{}, paper=PAPER, earned=0, max=0;
    var resBox=document.getElementById("examResult"); resBox.innerHTML="";
    var rows=h("div",{class:"card"});
    var flagged=[], examRows=[];   // 未掌握题目；逐题结果（供教师端热力图）
    paper.questions.forEach(function(it){
      var r;
      if(it.type==="single"||it.type==="multiple"||it.type==="judge"){ var correct=gradeObjectiveJS(it,ans[it.qid]); r={correct:correct,earned:correct?it.score:0,max:it.score}; }
      else { r=gradeSubjectiveJS(it,ans[it.qid]||""); r.correct=null; }
      earned+=r.earned; max+=r.max;
      // 未掌握判定：客观题答错，或主观题得分率 < 60%
      var weak = (r.correct===false) || (r.correct===null && r.earned < r.max*0.6);
      if(weak) flagged.push(it);
      examRows.push({qid:it.qid, kp_id:it.kp_id, chapter:it.chapter, type:it.type, correct:r.correct, earned:r.earned, max:r.max});
      var line=h("div",{style:"padding:8px 0;border-bottom:1px solid #eef1f6"});
      line.appendChild(h("div",{class:"row",style:"justify-content:space-between"},[
        h("div",{class:"small"},["第"+it.seq+"题 · "+(it.kp_id||"")]),
        h("span",{class:"pill "+(r.correct===true?"ok":r.correct===false?"warn":(r.earned>=r.max*0.6?"blue":"draft"))},[r.correct===true?"✔ 正确":r.correct===false?"✘ 错误":("得分 "+r.earned+"/"+r.max)])
      ]));
      if(it.rubric&&it.rubric.steps&&r.hits){
        var sb=h("div",{class:"small muted",style:"margin-top:4px"});
        it.rubric.steps.forEach(function(s,i){ sb.appendChild(h("div",{style:"color:"+(r.hits[i]?"#1f9d55":"#d64545")},[(i+1)+". "+(r.hits[i]?"✓":"✗")+" "+(s.text||"").slice(0,60)])); });
        line.appendChild(sb);
      }
      if(weak){
        line.appendChild(h("div",{class:"row",style:"margin-top:6px"},[
          h("button",{class:"btn sm", onclick:function(){ if(addMistake(it.qid,"评阅未掌握（得分"+r.earned+"/"+r.max+"）")) alert("已加入错题本"); else alert("已在错题本中"); }},["加入错题本"])
        ]));
      }
      rows.appendChild(line);
    });
    // 留存本次评阅结果，供「教师驾驶舱 · 知识点掌握热力图」使用
    window.__lastExam={paper:PAPER.title, course:COURSE, date:todayStr(), results:examRows};
    resBox.appendChild(rows);
    resBox.appendChild(h("div",{class:"stat",style:"margin-top:12px"},[h("div",{class:"n"},[earned+"/"+max]),h("div",{class:"l"},["总评 "+(max?Math.round(earned/max*100):0)+"%"])]));
    if(flagged.length){
      resBox.appendChild(h("div",{class:"card",style:"margin-top:10px"},[
        h("div",{class:"small muted"},["本次有 "+flagged.length+" 道未掌握题（客观题答错 / 主观题得分率<60%）。"]),
        h("button",{class:"btn sm",style:"margin-top:8px", onclick:function(){
          var n=0; flagged.forEach(function(it){ if(addMistake(it.qid,"评阅未掌握（一键加入）")) n++; });
          alert("已加入 "+n+" 道到错题本"+(flagged.length-n>0?"（"+ (flagged.length-n) +" 道已在错题本中）":""));
        }},["把 "+flagged.length+" 道未掌握题加入错题本"])
      ]));
    }
  }
  // ---- TAB: 成绩报表 ----
  var SAMPLE_CLASS="学01,2023001,82,75,80\n学02,2023002,90,88,92\n学03,2023003,70,60,55\n学04,2023004,95,90,93\n学05,2023005,78,72,68\n学06,2023006,88,80,85\n学07,2023007,65,58,52\n学08,2023008,84,79,81\n学09,2023009,92,86,90\n学10,2023010,74,66,60";
  function renderGrade(){
    view.innerHTML="";
    view.appendChild(h("h2",{class:"sec"},[iconUser(),"成绩报表 · 平时30%+期中20%+期末50%"]));
    view.appendChild(h("div",{class:"card"},[h("div",{class:"small muted"},["粘贴班级成绩（每行：姓名,学号,平时,期中,期末），或点「载入示例班级」。权重固定 30% / 20% / 50%。"])]));
    var ta=h("textarea",{id:"gradeCSV",rows:"6",style:"width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:inherit;margin-top:8px",placeholder:"张三,2023001,85,78,82"});
    view.appendChild(ta);
    var btns=h("div",{class:"row",style:"margin-top:8px;gap:8px"});
    btns.appendChild(h("button",{class:"btn sm",onclick:function(){ computeGrade(ta.value); }},["生成报表"]));
    btns.appendChild(h("button",{class:"btn sm ghost",onclick:function(){ ta.value=SAMPLE_CLASS; }},["载入示例班级"]));
    view.appendChild(btns);
    view.appendChild(h("div",{id:"gradeOut",style:"margin-top:14px"}));
  }
  function computeGrade(csv){
    var rows=csv.trim().split(/\n+/).map(function(l){return l.split(/[,，\t]/).map(function(x){return x.trim();});}).filter(function(r){return r.length>=5;});
    var st=rows.map(function(r){return {name:r[0],sid:r[1],usual:parseFloat(r[2])||0,mid:parseFloat(r[3])||0,final:parseFloat(r[4])||0};});
    st.forEach(function(s){ s.total=Math.round((s.usual*0.3+s.mid*0.2+s.final*0.5)*10)/10; });
    st.sort(function(a,b){return b.total-a.total;});
    st.forEach(function(s,i){s.rank=i+1;});
    var out=document.getElementById("gradeOut"); out.innerHTML="";
    var avg=Math.round(st.reduce(function(a,s){return a+s.total;},0)/st.length*10)/10;
    out.appendChild(h("div",{class:"stat",style:"margin-bottom:12px"},[h("div",{class:"n"},[String(avg)]),h("div",{class:"l"},["班级平均分（"+st.length+"人）"])]));
    var tbl=h("table",{class:"t",style:"width:100%"});
    tbl.appendChild(h("tr",{},[h("th",{},["排名"]),h("th",{},["姓名"]),h("th",{},["学号"]),h("th",{},["平时30"]),h("th",{},["期中20"]),h("th",{},["期末50"]),h("th",{},["总评"])]));
    st.forEach(function(s){ tbl.appendChild(h("tr",{},[h("td",{},[String(s.rank)]),h("td",{},[s.name]),h("td",{},[s.sid]),h("td",{},[String(s.usual)]),h("td",{},[String(s.mid)]),h("td",{},[String(s.final)]),h("td",{},[String(s.total)])])); });
    out.appendChild(tbl);
    var dist=[0,0,0,0,0]; st.forEach(function(s){ var t=s.total; if(t>=90)dist[0]++; else if(t>=80)dist[1]++; else if(t>=70)dist[2]++; else if(t>=60)dist[3]++; else dist[4]++; });
    var d2=[{k:"优秀≥90",v:dist[0]},{k:"良好80-89",v:dist[1]},{k:"中等70-79",v:dist[2]},{k:"及格60-69",v:dist[3]},{k:"不及格<60",v:dist[4]}];
    out.appendChild(h("div",{class:"card chart-card",style:"margin-top:12px"},[h("h2",{class:"sec"},["成绩分布"]),h("div",{html:hbars(d2,"#1b6ec2")})]));
  }

  // ================= LA 教师驾驶舱：知识点掌握热力图 + 教学改进建议 =================
  function clampNum(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }
  function hashStr(s){ var x=0; s=String(s||""); for(var i=0;i<s.length;i++){ x=(x*31+s.charCodeAt(i))>>>0; } return x; }
  function simClassAvg(){
    try{
      var rows=SAMPLE_CLASS.trim().split(/\n+/).map(function(l){return l.split(/[,，]/);}).filter(function(r){return r.length>=5;});
      var t=rows.reduce(function(a,r){ return a + ((parseFloat(r[2])||0)*0.3 + (parseFloat(r[3])||0)*0.2 + (parseFloat(r[4])||0)*0.5); },0);
      return rows.length? t/rows.length : 75;
    }catch(e){ return 75; }
  }
  // 每个知识点的掌握率：优先用真实评阅结果，未覆盖的用示例班级推算，并叠加本机错题惩罚
  function kpMastery(){
    var ex=window.__lastExam||null;
    var real = !!(ex && ex.course===COURSE && ex.results && ex.results.length);
    var base = simClassAvg();
    var missMap={};
    (STORE.mistakes||[]).forEach(function(m){ if(mCourse(m)!==COURSE || m.master) return; missMap[m.kp]=(missMap[m.kp]||0)+1; });
    var rows=KPS.map(function(k){
      var rate=null;
      if(real){
        var rs=(ex.results||[]).filter(function(r){ return r.kp_id===k.kp_id; });
        if(rs.length){ rate = rs.reduce(function(a,r){ return a + (r.max? r.earned/r.max : 0); },0)/rs.length*100; }
      }
      if(rate===null){
        var noise=((hashStr(k.kp_id+"|"+k.title)%40)-14);   // 确定性扰动 -14..+25
        rate=clampNum(base+noise, 25, 98);
      }
      var miss=missMap[k.kp_id]||0;
      rate=Math.max(15, rate - miss*6);   // 未掌握错题每题扣 6 分
      return {kp_id:k.kp_id, title:k.title, chapter:k.chapter, rate:Math.round(rate), miss:miss};
    });
    return {real:real, base:Math.round(base), rows:rows};
  }
  function heatColor(r){
    if(r>=85) return "#1a7f37";
    if(r>=70) return "#6ab04c";
    if(r>=60) return "#f0b429";
    return "#d64545";
  }
  function heatmapSVG(rows){
    var byCh={};
    rows.forEach(function(r){ (byCh[r.chapter]=byCh[r.chapter]||[]).push(r); });
    var chs=Object.keys(byCh).map(Number).sort(function(a,b){return a-b;});
    var CW=46, CH=30, GAP=4, LBL=62, PAD=6;
    var maxN=Math.max.apply(null, chs.map(function(c){return byCh[c].length;}))||1;
    var W=LBL+maxN*(CW+GAP)+PAD*2+8;
    var H=chs.length*(CH+GAP)+PAD*2+8;
    var s='<svg width="100%" viewBox="0 0 '+W+' '+H+'" style="max-width:'+W+'px">';
    chs.forEach(function(c,i){
      var y=PAD+i*(CH+GAP);
      s+='<text x="4" y="'+(y+CH/2+4)+'" font-size="11" fill="#1f2d3d">第'+c+'章</text>';
      byCh[c].forEach(function(k,j){
        var x=LBL+j*(CW+GAP);
        s+='<rect x="'+x+'" y="'+y+'" width="'+CW+'" height="'+CH+'" rx="5" fill="'+heatColor(k.rate)+'" opacity="0.92"></rect>';
        s+='<text x="'+(x+CW/2)+'" y="'+(y+CH/2+4)+'" font-size="10.5" text-anchor="middle" fill="#fff" font-weight="600">'+k.rate+'</text>';
        s+='<title>'+esc(k.kp_id+" "+k.title+"：掌握率 "+k.rate+"%")+'</title>';
      });
    });
    s+='</svg>';
    return s;
  }
  function dashSuggestions(rows){
    var out=[];
    var byCh={};
    rows.forEach(function(r){ (byCh[r.chapter]=byCh[r.chapter]||[]).push(r); });
    var chAgg=Object.keys(byCh).map(function(c){
      var arr=byCh[c];
      return {chapter:Number(c), avg:Math.round(arr.reduce(function(a,x){return a+x.rate;},0)/arr.length), n:arr.length};
    }).sort(function(a,b){ return a.avg-b.avg; });
    chAgg.slice(0,3).forEach(function(c){
      var ct=(D.chapters||[]).filter(function(x){return x.chapter===c.chapter;})[0];
      out.push({t:"章节", s:"第"+c.chapter+"章「"+(ct?ct.title:"")+"」平均掌握率 "+c.avg+"%（"+c.n+"个知识点），为班级薄弱环节，建议安排 1 次专题复习 + 针对性小测。"});
    });
    rows.slice().sort(function(a,b){ return a.rate-b.rate; }).slice(0,6).forEach(function(k){
      var extra = k.miss? ("；本机错题本中该知识点尚有 "+k.miss+" 题未掌握"):"";
      out.push({t:"知识点", s:k.kp_id+"「"+k.title+"」掌握率 "+k.rate+"%"+extra+"，建议补充例题讲解与变式训练。"});
    });
    var missN=(STORE.mistakes||[]).filter(function(m){ return mCourse(m)===COURSE && !m.master; }).length;
    if(missN>0) out.push({t:"错题", s:"本机错题本现存 "+missN+" 道未掌握题，建议按 1/2/4/7/15 天间隔复习节奏完成重练。"});
    if(!(window.__lastExam && window.__lastExam.course===COURSE))
      out.push({t:"数据", s:"当前为示例推算数据。教师在「智能评阅」完成一次班级评阅后，热力图将自动切换为该次实测掌握率。"});
    return out;
  }
  function renderDashLA(){
    view.innerHTML="";
    view.appendChild(h("h2",{class:"sec"},[iconDash(),"教师驾驶舱 · 知识点掌握分析（物流企业会计）"]));
    var m=kpMastery();
    var avgAll=Math.round(m.rows.reduce(function(a,r){return a+r.rate;},0)/(m.rows.length||1));
    var weakN=m.rows.filter(function(r){return r.rate<70;}).length;
    var g=h("div",{class:"dash-grid"});
    [["知识点总数",m.rows.length],["平均掌握率",avgAll+"%"],["薄弱知识点(<70%)",weakN],
     ["示例班级均分",m.base],["题库题量",((D.index&&D.index.total)||(D.questions||[]).length)+"题"],
     ["数据来源",(m.real?"本次评阅实测":"示例推算")]]
      .forEach(function(p){ g.appendChild(h("div",{class:"stat"},[h("div",{class:"n"},[String(p[1])]),h("div",{class:"l"},[p[0]])])); });
    view.appendChild(g);

    var hc=h("div",{class:"card chart-card",style:"margin-top:14px"});
    hc.appendChild(h("h2",{class:"sec"},["知识点掌握热力图"]));
    hc.appendChild(h("div",{class:"small muted"},[
      (m.real? ("数据来源：最近一次「智能评阅」（"+esc((window.__lastExam.paper||""))+"），按知识点汇总得分率；未覆盖的知识点以示例推算补齐。")
             : ("数据来源：示例班级成绩推算（演示）。在「智能评阅」完成一次评阅后将自动切换为实测数据。"))
    ]));
    hc.appendChild(h("div",{style:"margin-top:10px;overflow-x:auto",html:heatmapSVG(m.rows)}));
    var lg=h("div",{class:"row",style:"margin-top:10px;gap:12px;flex-wrap:wrap"});
    [["#1a7f37","掌握好 ≥85%"],["#6ab04c","良好 70–84%"],["#f0b429","警戒 60–69%"],["#d64545","薄弱 <60%"]]
      .forEach(function(x){
        lg.appendChild(h("span",{class:"row",style:"align-items:center;gap:5px"},[
          h("i",{style:"display:inline-block;width:14px;height:14px;border-radius:3px;background:"+x[0]}),
          h("span",{class:"small muted"},[x[1]])
        ]));
      });
    hc.appendChild(lg);
    view.appendChild(hc);

    var sc=h("div",{class:"card",style:"margin-top:14px"});
    sc.appendChild(h("h2",{class:"sec"},["教学改进建议（自动生成）"]));
    sc.appendChild(h("div",{class:"small muted"},["按掌握率由低到高排序，优先处理排在最前的章节与知识点。"]));
    dashSuggestions(m.rows).forEach(function(s){
      sc.appendChild(h("div",{style:"padding:8px 0;border-bottom:1px solid #eef1f6"},[
        h("span",{class:"pill "+(s.t==="章节"?"warn":s.t==="知识点"?"blue":"draft")},[s.t]),
        h("span",{style:"margin-left:8px"},[s.s])
      ]));
    });
    view.appendChild(sc);
  }

  var tabs={overview:renderOverview, syllabus:renderSyllabus, kg:renderKG, quiz:renderQuiz, mistakes:renderMistakes, daily:renderDaily, roadmap:renderRoadmap, paper:renderPaper, autoexam:renderAutoExam, grade:renderGrade, mine:renderMine, dash:renderDash, review:renderReview, agent:renderAgent};
  function go(tab){
    document.querySelectorAll("#nav button").forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-tab")===tab); });
    (tabs[tab]||renderOverview)();
    window.scrollTo(0,0);
  }
  document.getElementById("nav").addEventListener("click", function(e){ if(e.target.getAttribute("data-tab")) go(e.target.getAttribute("data-tab")); });
  go("overview");

  // ---------- PWA: 注册 service worker（离线可用） ----------
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
})();
